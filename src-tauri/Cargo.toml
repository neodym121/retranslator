[package]
name = "retranslator"
version = "0.2.0"
description = "Local Anthropic-compatible gateway that relays Claude Desktop requests to any provider"
authors = ["neodym121"]
repository = "https://github.com/neodym121/retranslator"
edition = "2021"
rust-version = "1.90"

[lib]
name = "retranslator_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "charset", "rustls-tls", "rustls-tls-native-roots"] }
futures-util = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
rand = "0.9"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
