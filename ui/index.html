<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retranslator</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <div class="wordmark" data-tauri-drag-region>
        <svg class="logo" viewBox="20 8 216 236" width="14" height="15" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
            <path d="M99.63 57.84A36 36 0 0 0 99.63 102.16M156.37 102.16A36 36 0 0 0 156.37 57.84M77.57 40.6A64 64 0 0 0 77.57 119.4M178.43 119.4A64 64 0 0 0 178.43 40.6M55.5 23.36A92 92 0 0 0 55.5 136.64M200.5 136.64A92 92 0 0 0 200.5 23.36M128 108L86 226M128 108L170 226M103.5 182H152.5" />
          </g>
          <circle class="logo-dot" cx="128" cy="80" r="17" />
        </svg>
        Retranslator
      </div>
      <div class="window-controls">
        <button class="win-btn" id="win-min" aria-label="Minimize">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M1 5.5h8" /></svg>
        </button>
        <button class="win-btn" id="win-max" aria-label="Maximize">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><rect x="1.5" y="1.5" width="7" height="7" /></svg>
        </button>
        <button class="win-btn win-close" id="win-close" aria-label="Close">
          <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg>
        </button>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="tabs" id="tabs">
        <button class="tab" data-tab="connect"></button>
        <button class="tab" data-tab="providers"></button>
        <button class="tab" data-tab="models"></button>
        <button class="tab" data-tab="logs"></button>
        <button class="tab" data-tab="server"></button>
      </nav>
      <div class="server-box">
        <div class="server-row">
          <div class="mono-label" id="server-label"></div>
          <button class="lang-btn" id="lang-toggle"></button>
        </div>
        <button class="btn btn-light" id="server-toggle"></button>
      </div>
    </aside>

    <main class="page">
      <section class="view" data-view="connect" id="view-connect"></section>
      <section class="view" data-view="providers" id="view-providers"></section>
      <section class="view" data-view="models" id="view-models"></section>
      <section class="view" data-view="logs" id="view-logs"></section>
      <section class="view" data-view="server" id="view-server"></section>
    </main>

    <dialog class="modal" id="modal"></dialog>
    <div class="toasts" id="toasts"></div>
  </body>
</html>
